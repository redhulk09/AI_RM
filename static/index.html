<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Risk Manager</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>AI Risk Manager</h1>
      <p>Capture, score, and review risks from one lightweight dashboard.</p>
    </header>

    <section class="card">
      <h2>Add risk</h2>
      <form id="risk-form">
        <div class="grid">
          <label>Title<input name="title" required maxlength="200"></label>
          <label>Category<input name="category" value="General"></label>
          <label>Owner<input name="owner" value="Unassigned"></label>
          <label>Likelihood (1-5)<input name="likelihood" type="number" min="1" max="5" value="3" required></label>
          <label>Impact (1-5)<input name="impact" type="number" min="1" max="5" value="3" required></label>
          <label>Control effectiveness (%)<input name="control_effectiveness" type="number" min="0" max="100" value="0"></label>
        </div>
        <label>Description<textarea name="description" rows="3"></textarea></label>
        <button type="submit">Create risk</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <div class="section-head"><h2>Risk register</h2><button id="refresh" class="secondary">Refresh</button></div>
      <div class="table-wrap">
        <table><thead><tr><th>Risk</th><th>Owner</th><th>Score</th><th>Severity</th><th>Recommendation</th><th>Actions</th></tr></thead><tbody id="risks"></tbody></table>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
